name: wealth

services:
  postgres:
    image: postgres:latest
    container_name: wealth-postgres
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: wealth-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: wealth-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data --license /minio.license
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
      - ./minio.license:/minio.license:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
