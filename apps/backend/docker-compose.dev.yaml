name: wealth

services:
  postgres:
    image: postgres:latest
    container_name: wealth-postgres
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: wealth-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: wealth-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data --license /minio.license
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
      - ./minio/minio.license:/minio.license:ro

  minio-init:
    image: quay.io/minio/aistor/mc:latest
    container_name: wealth-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    volumes:
      - ./minio/public-avatars-policy.json:/config/public-avatars-policy.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set-json /config/public-avatars-policy.json "local/$$STORAGE_BUCKET"

volumes:
  postgres-data:
  redis-data:
  minio-data:
